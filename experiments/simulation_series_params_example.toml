# Grid lists are crossed per regime: run_id = <name>_cNNNN, each run `shots` times. Grid overrides defaults.

[series]
name = "example-series"   # -> <data_root>/<name>/<run_id>/shot_NNN/
data_root = "data"
output_root = "output"

[defaults]
maze_config = "Ran_maze_size_prop_to_droplet"   # profile in maze_startpoints_configuration.toml
dt = 0.0005                # needs 200*dt <= 0.25
beta = -8                  # Bp = beta*1e4; negative = repulsion
emission_rate = 0.5        # droplets per time unit
grim_reaper_delay = 1.0    # delay between reaching exit and removal
desired_time = 20          # total sim time; overrides num_particles
n_steps = 10               # rolling buffer length (>= 2)
# num_particles = 60       # only used if desired_time = 0
part_every = 100           # particle snapshot interval (steps)
conc_every = 100           # concentration snapshot interval, multiple of part_every
test_run = false           # true forces the "Testrun" maze
resume_simulation = false  # resume from ckpt_previous.npz
seed = 0
track_decisions = true     # needs zones_file
zones_file = "different_mazes/Ran_maze_size_prop_to_droplet_analysis/zone_masks.npz"  # applies to all jobs; drop if sweeping mazes
decision_flush_loops = 100
stage_dir = "/dev/shm/maze_stage"   # tmpfs buffer for conc/part files
stage_budget_gb = 1.3               # per job; total = this x --jobs

[[regimes]]
name = "sweep"
shots = 5

[regimes.grid]
beta = [-4, -8, -12]       # 3 x 2 = 6 configurations
emission_rate = [0.5, 1.0]

[[regimes]]
name = "baseline"
shots = 10

[regimes.grid]
emission_rate = [1.0]
desired_time = [100]
conc_every = [1000]
